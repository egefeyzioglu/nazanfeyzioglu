name: Migrate production database

# Applies pending Drizzle migrations to the production database whenever
# migration files land on main (direct push or merged PR). drizzle-kit only
# runs migrations not yet recorded in the database's journal table, so
# re-running this workflow is a no-op when nothing is pending.
on:
  push:
    branches: [main]
    paths:
      - "drizzle/**"
      - "drizzle.config.ts"
  workflow_dispatch:

permissions:
  contents: read

# Never run two migrations against the same database at once, and never cancel
# one midway; later pushes queue behind the running job.
concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  migrate:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-database
    steps:
      - name: Check for database secret
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::PROD_DATABASE_URL is not set on the production-database environment."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: pnpm db:migrate
